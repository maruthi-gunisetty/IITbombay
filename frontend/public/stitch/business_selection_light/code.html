<script>
  (function () {
    const cards = document.querySelectorAll('.business-card');
    const continueBtn = document.getElementById('continue-btn');
    let selectedBusiness = 'education';

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        selectedBusiness = card.getAttribute('data-business');

        cards.forEach((c) => {
          const isSelected = c === card;
          c.setAttribute('aria-checked', isSelected ? 'true' : 'false');

          const iconWrap = c.querySelector('.card-icon-wrap');
          const iconSpan = iconWrap.querySelector('.material-symbols-outlined');
          const checkWrap = c.querySelector('.card-check');
          const checkSpan = checkWrap.querySelector('.material-symbols-outlined');
          const titleSpan = c.querySelector('.font-label-sm');
          const chips = c.querySelectorAll('.rounded-full');

          if (isSelected) {
            c.classList.remove('bg-white', 'border-slate-200', 'hover:border-slate-300');
            c.classList.add('bg-blue-50/70', 'border-2', 'border-blue-600');

            iconWrap.classList.remove('bg-slate-100', 'text-slate-600');
            iconWrap.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            iconSpan.style.fontVariationSettings = "'FILL' 1";

            checkWrap.classList.remove('text-slate-400', 'scale-95');
            checkWrap.classList.add('text-blue-600', 'scale-100');
            checkSpan.textContent = 'check_circle';
            checkSpan.style.fontVariationSettings = "'FILL' 1";

            titleSpan.classList.remove('text-slate-900');
            titleSpan.classList.add('text-blue-700');

            chips.forEach((chip) => {
              chip.classList.remove('bg-slate-100', 'text-slate-600');
              chip.classList.add('bg-white', 'border', 'border-blue-200', 'text-slate-800', 'shadow-xs', 'font-medium');
            });
          } else {
            c.classList.remove('bg-blue-50/70', 'border-2', 'border-blue-600');
            c.classList.add('bg-white', 'border', 'border-slate-200', 'hover:border-slate-300');

            iconWrap.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
            iconWrap.classList.add('bg-slate-100', 'text-slate-600');
            iconSpan.style.fontVariationSettings = "'FILL' 0";

            checkWrap.classList.remove('text-blue-600', 'scale-100');
            checkWrap.classList.add('text-slate-400', 'scale-95');
            checkSpan.textContent = 'radio_button_unchecked';
            checkSpan.style.fontVariationSettings = "'FILL' 0";

            titleSpan.classList.remove('text-blue-700');
            titleSpan.classList.add('text-slate-900');

            chips.forEach((chip) => {
              chip.classList.remove('bg-white', 'border', 'border-blue-200', 'text-slate-800', 'shadow-xs', 'font-medium');
              chip.classList.add('bg-slate-100', 'text-slate-600');
            });
          }
        });
      });
    });

    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        continueBtn.classList.add('opacity-90');
        setTimeout(() => {
          continueBtn.classList.remove('opacity-90');
        }, 150);
      });
    }
  })();
</script></main>
<script>
(function() {
  function goTo(screenName) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NAVIGATE', screen: screenName }, '*');
    } else {
      window.location.href = '../' + screenName + '/code.html';
    }
  }
  window.navigateToScreen = goTo;

  function bindEvents() {
    // Intercept Bottom Navigation
    document.querySelectorAll('nav a, a[data-path]').forEach(function(el) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', function(e) {
        var p = el.getAttribute('data-path') || el.innerText.trim().toLowerCase();
        if (p.includes('pos') || p === 'pos-sales') { e.preventDefault(); goTo('pos_sale_quick_invoice'); }
        else if (p.includes('udhar') || p.includes('credit') || p === 'credit-udhar') { e.preventDefault(); goTo('customer_udhar_whatsapp_follow_up'); }
        else if (p.includes('inventory') || p.includes('stock')) { e.preventDefault(); goTo('inventory_supplier_reorder'); }
        else if (p.includes('dash') || p === 'dashboard') { e.preventDefault(); goTo('retail_kirana_dashboard'); }
        else if (p.includes('more') || p.includes('report') || p.includes('gst')) { e.preventDefault(); goTo('ca_audit_gst_monthly_report'); }
      });
    });

    // Intercept action buttons
    document.querySelectorAll('button, a').forEach(function(btn) {
      var txt = (btn.innerText || '').trim();
      var id = btn.id || '';
      if (txt.includes('New POS Sale') || txt.includes('+ New POS')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('pos_sale_quick_invoice'); });
      } else if (txt.includes('Record Udhar') || id === 'newUdharBtn') {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('customer_udhar_whatsapp_follow_up'); });
      } else if (txt.includes('Stock In') || txt.includes('+ Inward Stock') || txt.includes('Inward Stock')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('inward_stock_grn_verification'); });
      } else if (txt.includes('Cash Flow') || txt.includes('Runway') || id === 'refresh-btn' || txt.includes('Safe Runway')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('cash_flow_forecast_simulator'); });
      } else if (id === 'continue-btn') {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          if (window.location.href.includes('business_selection')) goTo('onboarding_wizard');
          else goTo('retail_kirana_dashboard');
        });
      } else if (txt.includes('Draft PO') || txt.includes('Verify GRN')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('cash_flow_forecast_post_grn'); });
      } else if (txt.includes('Sharma General Kirana')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e) { e.preventDefault(); goTo('business_selection_light'); });
      }
    });

    // Back buttons
    document.querySelectorAll('button[aria-label="Go back"], button[onclick*="history.back"], a[href="#"]:has(span:contains("arrow_back"))').forEach(function(el) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', function(e) {
        e.preventDefault();
        goTo('retail_kirana_dashboard');
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindEvents);
  } else {
    bindEvents();
  }
})();
</script>
